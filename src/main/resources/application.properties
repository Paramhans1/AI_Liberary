# Spring datasource (H2 for quick start; change to MySQL/Postgres in production)
# In-memory H2 DB keeps data only for the JVM lifetime. For persistence use MySQL/Postgres and update URL/driver.
spring.datasource.url=jdbc:h2:mem:ailibrary;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 console (development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server
server.port=8080

# JWT configuration
# Replace the secret below with a securely generated base64-encoded key for production.
# You can generate one using: `openssl rand -base64 48` or Java's KeyGenerator
security.jwt.secret=change-me-to-a-secure-base64-secret
security.jwt.expiration-ms=3600000

# Mail (configure for a real SMTP in production)
# For local development use MailHog or MailDev on localhost:1025
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# AI / OpenAI placeholders
# Set `ai.openai.apiKey` to your OpenAI API key when ready. Keep secrets out of source control.
ai.openai.apiKey=
ai.openai.endpoint=https://api.openai.com/v1
ai.openai.model=text-embedding-3-small

# File storage
storage.upload-dir=${user.home}/ai-library-storage

# Payment / gateway placeholders
# Configure real payment gateway (Stripe/PayPal) credentials in production only
payment.gateway.provider=none
payment.gateway.apiKey=

# Logging
logging.level.org.springframework=INFO
logging.level.com.ai.library=DEBUG

# Actuator / Micrometer
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.server.port=
